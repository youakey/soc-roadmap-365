<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOC Roadmap 365</title>
<meta name="description" content="Личный трекер годового плана перехода в Junior SOC Analyst">
<meta name="theme-color" content="#06090f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f5f9" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SOC 365">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg?v=7">
<link rel="icon" href="icon.svg?v=7" type="image/svg+xml">
<link rel="stylesheet" href="styles.css?v=7">
</head>
<body>

<div class="env" aria-hidden="true">
  <div class="grid"></div>
  <span class="orb"></span><span class="orb"></span><span class="orb"></span>
  <div class="scan"></div>
</div>

<!-- ══════════ ВХОД ══════════ -->
<div id="gate">
  <div class="gate-card">
    <div class="gate-logo" id="gateLogo"></div>
    <h1 class="gate-title">SOC&nbsp;ROADMAP&nbsp;365</h1>
    <div id="gateBody"><p class="gate-note">Проверяю сессию…</p></div>
  </div>
</div>

<!-- ══════════ ВЫБОР ТРЕКА ══════════ -->
<div id="picker">
  <div class="picker-card">
    <h1 class="gate-title">SELECT&nbsp;TRACK</h1>
    <p class="gate-note">Один трек бесплатный целиком. Сменить можно позже.</p>
    <div id="pickerBody"></div>
  </div>
</div>

<!-- ══════════ APP ══════════ -->
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" id="brandMark"></span><span>SOC 365</span></div>
    <span class="spacer"></span>
    <span class="pill accent" id="topWeek">—</span>
    <button class="icon-btn" id="themeBtn" title="Тема"></button>
    <button class="icon-btn" id="outBtn" title="Выйти из аккаунта"></button>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <nav class="snav" id="snav"></nav>
      <div class="sidebar-foot"><div id="sideProgress"></div></div>
    </aside>

    <main>
      <section class="view on" id="v-today"></section>
      <section class="view" id="v-year"></section>
      <section class="view" id="v-weeks"></section>
      <section class="view" id="v-career"></section>
      <section class="view" id="v-rank"></section>
      <section class="view" id="v-more"></section>
    </main>
  </div>

  <nav class="tabbar" id="tabbar"></nav>
</div>

<div class="toast" id="toast"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#22e3d4"/>
      <stop offset="55%" stop-color="#3fc3e8"/>
      <stop offset="100%" stop-color="#4d9fff"/>
    </linearGradient>
  </defs>
</svg>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js?v=7"></script>
<script src="data-weeks.js?v=7"></script>
<script src="data.js?v=7"></script>
<script src="store.js?v=7"></script>
<script src="auth.js?v=7"></script>
<script src="sync.js?v=7"></script>
<script src="app.js?v=7"></script>
</body>
</html>
