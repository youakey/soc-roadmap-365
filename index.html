<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">

<!-- ══════════ ПОЛИТИКА БЕЗОПАСНОСТИ КОНТЕНТА ══════════
     GitHub Pages не отдаёт свои заголовки, поэтому политика живёт в meta.
     Стоит сразу после charset: meta-CSP действует только на то, что
     разобрано после неё, — ниже уже нет ни одного тега, который бы
     остался неприкрытым.

     Про две директивы, которых здесь намеренно нет:

     · frame-ancestors в meta игнорируется браузерами по спецификации,
       она работает только заголовком. Кликджекинг закрыт фреймбастером
       в security.js — на статике это единственный доступный способ.

     · require-trusted-types-for 'script' сломал бы весь рендеринг:
       он построен на шаблонных строках и innerHTML. Это честный долг,
       записан в §11 PROJECT.md.

     script-src сужен до одного конкретного файла, а не до домена
     jsdelivr: с него раздаётся весь npm, и разрешить его целиком —
     почти то же, что не ограничивать вовсе.

     style-src держит 'unsafe-inline' вынужденно: в шаблонах 91 атрибут
     style=. Вынести их в классы — отдельная работа, тоже в §11. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  base-uri 'none';
  object-src 'none';
  form-action 'none';
  frame-src 'none';
  child-src 'none';
  worker-src 'self';
  manifest-src 'self';
  script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.min.js;
  style-src 'self' 'unsafe-inline';
  img-src 'self' data:;
  font-src 'self';
  media-src 'none';
  connect-src 'self' https://wfjskomrcipjgsaxekny.supabase.co wss://wfjskomrcipjgsaxekny.supabase.co;
  upgrade-insecure-requests">

<!-- Адрес страницы не утекает третьим сторонам. Supabase реферер не проверяет. -->
<meta name="referrer" content="no-referrer">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="SOC 365">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest?v=23">
<link rel="apple-touch-icon" href="icon.svg?v=23">
<link rel="icon" href="icon.svg?v=23" type="image/svg+xml">
<link rel="stylesheet" href="styles.css?v=23">
</head>
<body>

<div class="env" aria-hidden="true">
  <div class="grid"></div>
  <span class="orb"></span><span class="orb"></span><span class="orb"></span>

  <!-- фоновый HUD: концентрические кольца радара, медленно вращаются -->

    <span class="hud-r r1"></span>
    <span class="hud-r r2"></span>
    <span class="hud-r r3"></span>
    <span class="hud-r r4"></span>
    <span class="hud-sweep"></span>
    <span class="hud-cross"></span>
  </div>

  <!-- падающие столбцы hex, наполняются из app.js -->

  <div class="scan"></div>
</div>

<!-- ══════════ ВХОД ══════════ -->
<div id="gate">
  <div class="gate-card">
    <div class="gate-logo" id="gateLogo"></div>
    <h1 class="gate-title">SOC&nbsp;ROADMAP&nbsp;365</h1>
    <div id="gateBody"><p class="gate-note">Проверяю сессию…</p></div>
  </div>
</div>

<!-- ══════════ ВЫБОР ТРЕКА ══════════ -->
<div id="picker">
  <div class="picker-card">
    <h1 class="gate-title">SELECT&nbsp;TRACK</h1>
    <p class="gate-note">Один трек бесплатный целиком. Сменить можно позже.</p>
    <div id="pickerBody"></div>
  </div>
</div>

<!-- ══════════ APP ══════════ -->
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" id="brandMark"></span><span>SOC 365</span></div>
    <span class="spacer"></span>
    <span class="netstat" id="netStat" aria-hidden="true"><i class="dot"></i><span class="lbl" id="netLbl">LINK</span><span id="netClock">--:--:--</span></span>
    <span class="pill accent" id="topWeek">—</span>
    <button class="icon-btn" id="themeBtn" title="Тема"></button>
    <button class="icon-btn" id="outBtn" title="Выйти из аккаунта"></button>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <nav class="snav" id="snav"></nav>
      <div class="sidebar-foot"><div id="sideProgress"></div></div>
    </aside>

    <main>
      <div class="crumbs" id="crumbs" aria-hidden="true"></div>
      <section class="view on" id="v-today"></section>
      <section class="view" id="v-anki"></section>
      <section class="view" id="v-year"></section>
      <section class="view" id="v-weeks"></section>
      <section class="view" id="v-career"></section>
      <section class="view" id="v-rank"></section>
      <section class="view" id="v-more"></section>
      <section class="view" id="v-settings"></section>
    </main>
  </div>

  <nav class="tabbar" id="tabbar"></nav>
</div>

<div class="toast" id="toast"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#22e3d4"/>
      <stop offset="55%" stop-color="#3fc3e8"/>
      <stop offset="100%" stop-color="#4d9fff"/>
    </linearGradient>
  </defs>
</svg>

<!-- Первым: фреймбастер должен сработать до отрисовки, а хелперы
     экранирования нужны раньше любого рендеринга. -->
<script src="security.js?v=23"></script>

<!-- ЕДИНСТВЕННАЯ ВНЕШНЯЯ ЗАВИСИМОСТЬ — запинена и закрыта хэшем.

     Версия точная, не диапазон: SRI на плавающем @2 уронил бы сайт при
     следующем релизе supabase-js. Хэш снят с трёх независимых запросов
     к CDN, все три совпали; файл 210 839 байт, и плавающий @2 на момент
     пина отдавал ровно его же.

     Подмена файла на стороне CDN теперь не выполнится: браузер сверит
     sha384 и откажется исполнять. CI сверяет этот хэш с тем, что реально
     отдаёт CDN, на каждый пуш и раз в неделю по расписанию
     (.github/workflows/security.yml).

     Обновление версии — одной командой, вручную хэш не переписывать:
         node tools/pin-dependency.mjs -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.min.js"
        integrity="sha384-fPWur1rx/DE6YtXP/x0MD6dd90RgnVsz5yX/DIg7CcVAnTBZsENWuIcpvVTM39ti"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script src="config.js?v=23"></script>
<script src="data-weeks.js?v=23"></script>
<script src="data.js?v=23"></script>
<script src="store.js?v=23"></script>
<script src="auth.js?v=23"></script>
<script src="sync.js?v=23"></script>
<script src="vocab.js?v=23"></script>
<script src="app.js?v=23"></script>
