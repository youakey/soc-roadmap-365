# ══════════════════════════════════════════════════════════════
# Проверки безопасности. ТОЛЬКО проверки, без деплоя.
#
# Почему без деплоя. GitHub Pages в этом репозитории собирается из
# ветки main (Settings → Pages → Deploy from a branch). Если добавить
# сюда job с pages: write и id-token: write, он будет падать, пока
# источник Pages не переключён на GitHub Actions, — а переключение
# ломает текущий рабочий деплой. Готовый deploy-job лежит рядом,
# в static.yml.disabled: включать вместе с переключением настройки.
#
# Права токена урезаны до чтения содержимого. Больше этому workflow
# ничего не нужно: он не пишет в репозиторий, не комментирует PR,
# не публикует пакеты.
# ══════════════════════════════════════════════════════════════
name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # раз в неделю: SRI ловит подмену на CDN только если его проверять
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # токен не остаётся в .git/config

      # ── 1. Опасные конструкции в DOM ────────────────────────
      # Статический анализ здесь надёжнее линтера: список короткий,
      # ложных попаданий нет, а появление любой из этих строк —
      # повод остановиться и подумать, а не предупреждение в логе.
      - name: Опасные синки
        run: |
          set -uo pipefail
          # javascript: ищем только там, где он опасен — в атрибуте, а не
          # в тексте. Первая версия паттерна ловила слово в комментарии,
          # который его же и объясняет, и роняла сборку на security.js.
          PATTERN='\beval[[:space:]]*\(|new[[:space:]]+Function[[:space:]]*\(|document\.write|\.outerHTML[[:space:]]*=|insertAdjacentHTML|(href|src|action)[[:space:]]*=[[:space:]]*.?[[:space:]]*javascript:'
          if grep -nEr --include='*.js' --include='*.html' --exclude-dir=node_modules "$PATTERN" . ; then
            echo "::error::Найдены опасные конструкции. Разбирать вручную."
            exit 1
          fi
          echo "Опасных синков нет."

      # ── 2. CSP на месте и не ослаблена ──────────────────────
      - name: CSP
        run: |
          set -uo pipefail
          f=index.html
          grep -q 'http-equiv="Content-Security-Policy"' "$f" || { echo "::error::CSP пропала из $f"; exit 1; }
          for bad in "unsafe-eval" "script-src 'self' 'unsafe-inline'" "default-src \*" "script-src \*"; do
            if grep -q "$bad" "$f"; then echo "::error::CSP ослаблена: $bad"; exit 1; fi
          done
          grep -q "object-src 'none'" "$f" || { echo "::error::object-src 'none' пропал"; exit 1; }
          grep -q "base-uri 'none'"   "$f" || { echo "::error::base-uri 'none' пропал"; exit 1; }
          echo "CSP на месте."

      # ── 3. Секреты ──────────────────────────────────────────
      # Свой скрипт, без сторонних action: тащить в CI чужой бинарник,
      # который ищет утечки, — сомнительная сделка. Скрипт разбирает
      # JWT и смотрит claim role, а не ищет слово "service_role":
      # первая версия падала на комментарии о том, что такого ключа
      # здесь быть не должно.
      - name: Секреты
        run: node tools/scan-secrets.mjs

      # ── 4. Цепочка поставок: SRI ────────────────────────────
      # Валит сборку, пока зависимость не запинена и не закрыта хэшем,
      # и потом — если файл на CDN разошёлся с хэшем в репозитории.
      - name: SRI внешней зависимости
        run: node tools/pin-dependency.mjs --check

      # ── 5. ESLint с плагином безопасности ───────────────────
      - name: ESLint security
        run: |
          npm install --no-save --no-audit --no-fund --loglevel=error \
            eslint@9.13.0 eslint-plugin-security@3.0.1
          # Сначала прогон с показом предупреждений — он нужен как отчёт в логе.
          npx eslint --config eslint.config.mjs \
            app.js auth.js store.js sync.js vocab.js zero.js sound.js fx.js content.js person.js config.js security.js data.js data-weeks.js tools/*.mjs \
            --max-warnings 400 || true
          # Затем прогон, который валит сборку на ошибках (правила из блока error).
          npx eslint --config eslint.config.mjs \
            app.js auth.js store.js sync.js vocab.js zero.js sound.js fx.js content.js person.js config.js security.js tools/*.mjs

      # ── 6. Таббар не отклеится снова ────────────────────────
      # Баг кусал дважды: transform на #app делает его containing block
      # для position: fixed, и таббар начинает считаться от #app, а не
      # от экрана — появляется только внизу страницы. Проверка дешёвая,
      # а руками это не ловится: зависит от того, успела ли анимация.
      - name: appIn без transform
        run: |
          set -uo pipefail
          block=$(grep -A 1 '@keyframes appIn' styles.css || true)
          if echo "$block" | grep -qE 'transform|scale\(|filter|perspective'; then
            echo "::error::В кадре appIn появился transform/filter. #app станет containing block для position: fixed, и таббар на телефоне отклеится. См. §3.5 PROJECT.md."
            exit 1
          fi
          if grep -qE '#app\.on \{[^}]*animation:[^;]*\bboth\b' styles.css; then
            echo "::error::У #app.on снова fill-mode both."; exit 1
          fi
          echo "appIn чист."

      # ── 7. Права токена не расширили ────────────────────────
      - name: Права workflow
        run: |
          set -uo pipefail
          for f in .github/workflows/*.yml; do
            if grep -qE '^\s*permissions:\s*write-all' "$f"; then
              echo "::error::$f просит write-all"; exit 1
            fi
          done
          grep -qE '^permissions:' .github/workflows/security.yml || { echo "::error::нет явного блока permissions"; exit 1; }
          echo "Права описаны явно."

      # ── 8. Звук не заводится при загрузке страницы ──────────
      # AudioContext, созданный вне жеста, на iOS остаётся suspended
      # навсегда — и молча: ни одной ошибки в консоли. Проверка
      # дешёвая и ловит ровно ту правку, которой это ломается:
      # любой вызов Sound.* внутри самого sound.js. Файл только
      # объявляет объект и обращается к себе через this — значит
      # имени Sound там нет вовсе, и появление его означает, что
      # файл начал что-то делать сам по себе.
      - name: Звук не стартует на загрузке
        run: |
          set -uo pipefail
          if grep -nE '^[[:space:]]*Sound\.' sound.js; then
            echo "::error::sound.js что-то выполняет при загрузке. Контекст должен рождаться только внутри жеста, см. §12.5 PROJECT.md."
            exit 1
          fi
          if grep -nE 'new[[:space:]]+(window\.)?(webkit)?AudioContext' app.js; then
            echo "::error::AudioContext создаётся мимо sound.js. Контекст на страницу ровно один, см. §12.5."
            exit 1
          fi
          echo "Звук ждёт жеста."

      # ── 9. Спецэффекты не трогают предков таббара ───────────
      # §3.5-bis: transform/filter/perspective/contain/will-change
      # у #app, .layout, main или .view делают их containing block
      # для position: fixed, и таббар отклеивается. Эффекты §12.6
      # вешаются только на карточки и на собственный узел экрана
      # загрузки в body — здесь это и проверяется, по селекторам
      # в JS, а не по CSS: класс ставит именно JS.
      - name: Эффекты мимо предков fixed
        run: |
          set -uo pipefail
          if grep -nE "getElementById\('app'\)|querySelector\('(#app|\.layout|main|\.view)" fx.js; then
            echo "::error::fx.js целится в предка таббара. Эффекты живут на карточках и в body, см. §3.5-bis и §12.6."
            exit 1
          fi
          if grep -nE '^[[:space:]]*Fx\.' fx.js; then
            echo "::error::fx.js что-то выполняет при загрузке."
            exit 1
          fi
          # Экран загрузки обязан лежать в body: внутри #app он взведёт
          # ту же мину, из-за которой таббар уезжал дважды.
          grep -q 'document.body.appendChild' fx.js || { echo "::error::экран загрузки больше не в body"; exit 1; }
          echo "Эффекты на месте."

      # ── 10. Сид содержания трека не разошёлся с кодом ───────
      # §3.2: 52 недели переехали в roadmaps.content, а блок 11
      # supabase.sql сеет их на чистом проекте. Блоб там генерируется
      # из data-weeks.js и data.js — и разойтись с ними может молча:
      # правку недели видно в репозитории, а старый сид на новом
      # проекте не видно вовсе. Скрипт заодно пересчитывает восемь
      # производных дат вкладки YEAR (§12.1-bis) и краснеет, если
      # подпись квартала разъехалась с границами недель.
      - name: Сид содержания сверен с кодом
        run: node tools/seed-content.mjs --check

      # ── 11. Клиент не пишет в содержание общего трека ───────
      # §11.1: клиент не граница безопасности. Содержание трека видят
      # все вошедшие, поэтому запись в roadmaps из браузера закрыта
      # на уровне RLS (блок 9.5) — и попытка её обойти должна ловиться
      # здесь, а не обнаруживаться подменённым треком у всех сразу.
      - name: Содержание трека только на чтение
        run: |
          set -uo pipefail
          # Обращение к таблице переносится на следующую строку, поэтому
          # смотрим окно, а не строку: grep по одной строке эту запись
          # просто не увидел бы. Ловим глагол записи в двух строках после.
          if grep -A 2 -nE "from\('roadmaps'\)" -- *.js \
             | grep -nE "\.(update|upsert|insert|delete)\("; then
            echo "::error::клиент пишет в roadmaps. Содержание общего трека правит владелец из SQL Editor, см. §3.2-bis и блок 9.5."
            exit 1
          fi
          if grep -nE "\.(update|upsert|insert|delete)\(" content.js; then
            echo "::error::content.js что-то пишет. Он только читает, см. §3.2-bis."
            exit 1
          fi

      # ── 12. Параметры человека не уезжают в публичные таблицы ───
      # §3.1 — главное решение проекта: приватное и публичное разделены
      # НА УРОВНЕ ТАБЛИЦ. `profiles` читает каждый вошедший (политика
      # «profiles read all» с using (true)), поэтому город, бюджет
      # и железо человека там оказаться не могут. Ловим попытку
      # положить их туда или в public_stats: и то и другое пишется
      # с клиента, и оба вызова видно грепом.
      - name: Параметры человека — только в своей таблице
        run: |
          set -uo pipefail
          if grep -A 6 -nE "from\('(profiles|public_stats)'\)" -- *.js \
             | grep -nE "Person\.|params|PERSON_FIELDS"; then
            echo "::error::параметры человека уезжают в публичную таблицу. §3.1: приватное живёт в public.person, блок 12."
            exit 1
          fi
          # person.js обязан ходить только в свою таблицу.
          if grep -nE "\.from\('" person.js | grep -v "from('person')"; then
            echo "::error::person.js читает или пишет чужую таблицу. См. §13.2-bis."
            exit 1
          fi

      # ── 13. Личное не возвращается в трек ───────────────────
      # §13.2 шаг 2 вынул параметры человека из содержания. Обратно
      # они возвращаются одной строчкой «пока оставлю, потом уберу»,
      # и заметить это можно через месяц. Счётчик швов внутри задач
      # обязан быть нулём, и seed-content.mjs теперь на этом падает —
      # проверка 10 его уже гоняет. Здесь сторожим то, чего он
      # не видит: живые массивы в data.js обязаны наполняться
      # шаблонами, а не литералами.
      - name: Личные блоки идут через шаблон
        run: |
          set -uo pipefail
          for n in HARDWARE MARKET OUTCOMES LANGS RULES RED_FLAGS APP_CATEGORIES BUDGET_TEXT; do
            grep -qE "^const ${n}_RAW" data.js || { echo "::error::в data.js нет ${n}_RAW — личный блок снова записан литералом."; exit 1; }
            grep -qE "^const ${n} = \[\]" data.js || { echo "::error::${n} в data.js больше не пустой живой массив."; exit 1; }
          done
          echo "Личные блоки разделены."

          echo "Содержание трека на чтение."
