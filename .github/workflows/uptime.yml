# Живость проекта и сайта — §8 «Мониторинг».
#
# ЗАЧЕМ. Free-проект Supabase уходит в паузу за простой, и владелец
# узнал об этом, увидев экран входа (§3.2-ter). Отдельно: зелёный CI
# не означает выложенный сайт — 07.08.2026 конвейер `security` был
# зелёным, а `pages-build-deployment` падал почти сутки (§3.11).
# Обе беды тихие, и обе видны одной строкой снаружи.
#
# ПОЧЕМУ БЕЗ ЕДИНОГО СЕКРЕТА. `/auth/v1/health` отдаёт 200 и своё имя
# вообще без ключа — проверено 02.09.2026. Считать регистрации отсюда
# НЕЛЬЗЯ: анонимному ключу RLS не показывает ни одной строки ни в
# `leaderboard`, ни в `public_stats`, ни в `profiles` (тоже проверено,
# везде `*/0`). Значит либо секрет в репозитории, либо глаза раз
# в неделю; выбрано второе — см. §8.
#
# ПОБОЧНЫЙ ЭФФЕКТ, КОТОРЫЙ НАДО ЗНАТЬ. Пауза считается от простоя
# проекта. Ежедневный запрос к `/auth/v1/health` бьёт в GoTrue,
# а не в базу, и скорее всего простоем считаться не перестанет —
# но проверено это НЕ было. Если проект внезапно перестанет
# засыпать, причина здесь.
name: uptime

on:
  schedule:
    - cron: '0 6 * * *'      # 09:00 по Минску
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alive:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase отвечает
        run: |
          set -euo pipefail
          body=$(curl -fsS --max-time 20 https://wfjskomrcipjgsaxekny.supabase.co/auth/v1/health)
          echo "$body"
          echo "$body" | grep -q GoTrue

      - name: Сайт выложен и это наш сайт
        run: |
          set -euo pipefail
          page=$(curl -fsSL --max-time 20 https://youakey.github.io/soc-roadmap-365/)
          # не просто 200: страница обязана быть нашей и собранной,
          # иначе заглушка Pages пройдёт проверку как здоровый сайт
          echo "$page" | grep -q 'SOC'
          echo "$page" | grep -q 'app.js?v='
